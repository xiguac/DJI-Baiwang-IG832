# busybox httpd MIME type additions. Its built-in table only covers a
# handful of extensions (html/css/txt/...); anything else falls back to
# application/octet-stream, which Chrome refuses to execute as an ES module
# script (<script type="module">) or a stylesheet-adjacent asset. Discovered
# by actually curling the deployed assets and checking response headers.
.js:text/javascript
.mjs:text/javascript
.css:text/css
.svg:image/svg+xml
.woff:font/woff
.woff2:font/woff2
.json:application/json
.png:image/png
.ico:image/x-icon
